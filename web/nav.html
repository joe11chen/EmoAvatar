<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导航</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe2ea;
      --brand: #1463ff;
      --brand2: #0f4fd0;
    }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% 0%, #e9f0ff 0%, var(--bg) 45%);
      color: var(--text);
    }
    .wrap {
      max-width: 920px;
      margin: 36px auto;
      padding: 0 14px 24px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(18, 34, 66, 0.08);
    }
    .title {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0.3px;
    }
    .meta {
      color: var(--muted);
      margin: 0 0 18px;
      font-size: 14px;
    }
    .mode-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #e8f0ff;
      color: #234fb7;
      font-weight: 600;
      font-size: 12px;
      vertical-align: middle;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .entry {
      display: block;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(180deg, #fff 0%, #fbfcff 100%);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .entry:hover {
      transform: translateY(-2px);
      border-color: #b8caf8;
      box-shadow: 0 8px 20px rgba(20, 99, 255, 0.12);
    }
    .entry h3 {
      margin: 0 0 8px;
      font-size: 16px;
      color: var(--brand2);
    }
    .entry p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .foot {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1 class="title">LiveTalking 导航入口</h1>
      <p id="meta" class="meta">正在加载运行信息...</p>
      <div id="entries" class="grid"></div>
      <div class="foot">提示：页面按钮会根据当前 transport.mode 自动变化。</div>
    </div>
  </div>

  <script>
    const metaEl = document.getElementById('meta');
    const entriesEl = document.getElementById('entries');

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadRuntimeInfo() {
      try {
        const resp = await fetch('/runtime_info');
        const result = await resp.json();
        if (!result || result.code !== 0) {
          throw new Error((result && result.msg) || 'runtime_info failed');
        }
        const data = result.data || {};
        const mode = data.transport_mode || 'unknown';
        const entries = Array.isArray(data.entries) ? data.entries : [];

        metaEl.innerHTML = `当前运行模式：<span class="mode-badge">${escapeHtml(mode)}</span>`;
        if (entries.length === 0) {
          entriesEl.innerHTML = '<div class="entry"><h3>暂无可用入口</h3><p>请检查服务配置。</p></div>';
          return;
        }

        entriesEl.innerHTML = entries.map(item => `
          <a class="entry" href="${escapeHtml(item.path || '#')}">
            <h3>${escapeHtml(item.label || '未命名入口')}</h3>
            <p>${escapeHtml(item.desc || '')}</p>
          </a>
        `).join('');
      } catch (err) {
        metaEl.textContent = `加载失败：${String(err)}`;
        entriesEl.innerHTML = '';
      }
    }

    loadRuntimeInfo();
  </script>
</body>
</html>
